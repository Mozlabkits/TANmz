name: Construir TANmz Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do TANmz
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Criar local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Construir AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Guardar arquivo AAB
        uses: actions/upload-artifact@v4
        with:
          name: TANmz-release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
