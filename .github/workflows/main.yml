name: Construir TANmz Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. BAIXAR O PROJETO
      # =====================================================
      - name: Baixar código do TANmz
        uses: actions/checkout@v5

      # =====================================================
      # 2. CONFIGURAR NODE.JS 22
      # =====================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # =====================================================
      # 3. INSTALAR DEPENDÊNCIAS
      # =====================================================
      - name: Instalar dependências do projeto
        run: npm install

      # =====================================================
      # 4. CONSTRUIR A APLICAÇÃO WEB
      # =====================================================
      - name: Construir aplicação web
        run: npm run build

      # =====================================================
      # 5. SINCRONIZAR CAPACITOR COM ANDROID
      # =====================================================
      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      # =====================================================
      # 6. CONFIGURAR JAVA 21
      # =====================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # =====================================================
      # 7. CONFIGURAR ANDROID SDK
      # =====================================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      # =====================================================
      # 8. INSTALAR COMPONENTES DO ANDROID
      # =====================================================
      - name: Instalar Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # =====================================================
      # 9. CRIAR LOCAL.PROPERTIES
      # =====================================================
      - name: Criar local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # =====================================================
      # 10. DAR PERMISSÃO AO GRADLE
      # =====================================================
      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      # =====================================================
      # 11. LIMPAR O PROJETO ANDROID
      # =====================================================
      - name: Limpar projeto Android
        working-directory: android
        run: ./gradlew clean --no-daemon

      # =====================================================
      # 12. CONSTRUIR ANDROID APP BUNDLE
      # =====================================================
      - name: Construir AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # =====================================================
      # 13. GUARDAR O AAB
      # =====================================================
      - name: Guardar arquivo AAB
        uses: actions/upload-artifact@v4
        with:
          name: TANmz-release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # =====================================================
      # 14. GUARDAR APK RELEASE
      # =====================================================
      - name: Guardar APK release
        uses: actions/upload-artifact@v4
        with:
          name: TANmz-release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
